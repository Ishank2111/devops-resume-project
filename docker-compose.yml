services:
  backend:
      image: devops-portfolio:1.0
      ports:
         - "8080:8080"

      restart: always 

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
        interval: 30s
        timeout: 10s
        retries: 3      


  frontend:
      image: frontend:latest
      ports:
      - "5173:80"
      restart: always 


